<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CryptoLedger — Portfolio & Trade Tracker</title>
<style>
  :root{
    /* trading terminal — light variant */
    --bg:#f6f8fa; --panel:#ffffff; --panel2:#eef1f5; --border:#dfe3e8;
    --text:#0e1116; --muted:#5b6570; --accent:#1f883d; --accent-dark:#1a7332; --accent2:#0891b2;
    --green:#1a7f37; --red:#cf222e; --amber:#9a6700; --chip:#eef1f5;
    --hover:#eef1f5; --input-bg:#ffffff; --btn-hover:#eef1f5; --zebra:rgba(14,17,22,.022);
    --ease:cubic-bezier(.2,.8,.2,1);
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --radius:4px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
    --mono:ui-monospace,"SFMono-Regular","SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Liberation Mono",Menlo,monospace;
    --serif:var(--sans);   /* token kept so any old refs resolve to sans */
  }
  :root[data-theme="dark"]{
    /* trading terminal — dark (primary) */
    --bg:#0e1116; --panel:#161b22; --panel2:#12161c; --border:#232a33;
    --text:#e6edf3; --muted:#8b949e; --accent:#2ea043; --accent-dark:#25863a; --accent2:#22d3ee;
    --green:#3fb950; --red:#f85149; --amber:#d29922; --chip:#1c2128;
    --hover:#1a212b; --input-bg:#0d1117; --btn-hover:#222a33; --zebra:rgba(255,255,255,.022);
    --shadow:0 1px 0 rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font:14.5px/1.5 var(--sans);
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  /* monospace numerals — the terminal signature */
  .card .value,.hero .big,.ring .pctbig,.bignum,.goalstat .v,.bchip .bv{font-family:var(--mono);letter-spacing:-.3px}
  td{font-family:var(--mono)}
  td:first-child{font-family:var(--sans)}
  .logo{font-family:var(--mono)}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 22px 60px}
  header.app{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:14px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.3px}
  .logo .dot{width:20px;height:20px;border-radius:3px;background:var(--accent)}
  .spacer{flex:1}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{
    background:var(--panel);color:var(--text);border:1px solid var(--border);
    padding:8px 14px;border-radius:var(--radius);font-weight:600;display:inline-flex;gap:8px;align-items:center
  }
  .btn:hover{border-color:var(--muted);background:var(--btn-hover)}
  .btn.primary{background:var(--accent);border:1px solid var(--accent-dark);color:#fff}
  .btn.primary:hover{background:var(--accent-dark)}
  .btn.ghost{background:transparent}
  .btn.danger{color:#fff;background:var(--red);border:1px solid #7f1d1d}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:4px}
  .muted{color:var(--muted)}
  .tabs{display:flex;gap:20px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
  .tab{padding:9px 2px;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.6px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text);border-bottom-color:var(--accent)}
  .modeseg{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .modeseg button{background:var(--panel);border:none;color:var(--muted);padding:7px 18px;font-weight:600;font-size:14px}
  .modeseg button+button{border-left:1px solid var(--border)}
  .modeseg button.active{background:var(--accent);color:#fff}
  /* goal mode */
  .goalwrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;align-items:start}
  @media(max-width:760px){.goalwrap{grid-template-columns:1fr}}
  .ringcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 20px}
  .ring{position:relative;width:230px;height:230px}
  .ring.sm{width:160px;height:160px}
  .ring.sm .pctbig{font-size:32px}
  .ring.sm .pctsub{font-size:11px}
  .ring svg{transform:rotate(-90deg)}
  .ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ring .pctbig{font-size:46px;font-weight:700;line-height:1;letter-spacing:-.5px}
  .ring .pctsub{font-size:12.5px;color:var(--muted);margin-top:4px}
  .goalstat{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--border)}
  .goalstat:last-child{border-bottom:none}
  .goalstat .k{color:var(--muted);font-size:14px}
  .goalstat .v{font-weight:700;font-size:18px}
  .goalstat .v small{font-weight:400;color:var(--muted);display:block;text-align:right;font-size:12px}
  .bignum{font-size:32px;font-weight:700}
  .reached{background:#e6f0e8;border:1px solid #b6d4c0;color:#1a5e37;padding:12px 14px;border-radius:var(--radius);font-weight:700;text-align:center}
  .miniproj{width:100%;margin-top:6px}
  .miniproj td{padding:6px 8px;text-align:right;font-size:13px;border-bottom:1px dotted var(--border)}
  .miniproj tr:last-child td{border-bottom:none}
  .miniproj td:first-child{text-align:left;color:var(--muted)}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .card .label{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .card .value{font-size:25px;font-weight:700;margin-top:6px}
  .card .sub{font-size:12.5px;margin-top:4px}
  .pos{color:var(--green)} .neg{color:var(--red)} .neu{color:var(--muted)}
  .hero{grid-column:1/-1;display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
  .hero .big{font-size:42px;font-weight:700;line-height:1}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel h2{margin:0;padding:14px 18px;font-size:16px;font-weight:700;border-bottom:1px solid var(--border);background:var(--panel2);display:flex;align-items:center;gap:10px}
  .panel h2 .spacer{flex:1}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 12px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);font-weight:700}
  tbody tr{border-bottom:1px solid var(--border)}
  tbody tr:last-child{border-bottom:none}
  tbody tr:nth-child(even){background:var(--zebra)}   /* ledger ruling */
  tbody tr:hover{background:var(--hover)}
  .delta{font-size:.82em;margin-right:2px}
  .sym{display:flex;align-items:center;gap:10px}
  .sym .badge{width:30px;height:30px;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--chip);border:1px solid var(--border);overflow:hidden}
  .sym .badge img{width:100%;height:100%;object-fit:cover}
  .sym .meta small{color:var(--muted);display:block;font-weight:400}
  .tag{font-size:10.5px;padding:2px 7px;border-radius:3px;border:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:var(--panel2)}
  .tag.crypto{color:#b45309;border-color:#fce4a6;background:#fffbeb}
  .tag.stock{color:#1d4ed8;border-color:#c7dbfe;background:#eff6ff}
  .tag.DEPOSIT{color:var(--green)} .tag.WITHDRAW{color:var(--amber)} .tag.BUY{color:#1d4ed8} .tag.SELL{color:#9333ea} .tag.ADJUST{color:#4b5563}
  .empty{padding:44px 18px;text-align:center;color:var(--muted)}
  .empty .em{font-size:34px;margin-bottom:8px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(43,40,32,.42);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:520px;box-shadow:0 12px 40px rgba(40,34,20,.28)}
  .modal header{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--border);background:var(--panel2)}
  .modal header h3{margin:0;font-size:17px;font-weight:700}
  .modal .body{padding:18px}
  .modal .foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .field input,.field select{width:100%;background:var(--input-bg);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:var(--radius)}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(31,107,70,.12)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seg{display:flex;gap:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .seg button{flex:1;background:transparent;border:none;color:var(--muted);padding:8px;font-weight:600}
  .seg button+button{border-left:1px solid var(--border)}
  .seg button.active{background:var(--accent);color:#fff}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .calc{background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:13px;margin-top:6px}
  .search-results{border:1px solid var(--border);border-radius:var(--radius);margin-top:6px;max-height:190px;overflow:auto;display:none;background:var(--input-bg)}
  .search-results.open{display:block}
  .sr-item{padding:9px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;border-bottom:1px solid var(--border)}
  .sr-item:hover{background:var(--panel2)}
  .sr-item img{width:22px;height:22px;border-radius:4px}
  .iconbtn{background:transparent;border:none;color:var(--muted);padding:4px 7px;border-radius:4px;font-size:14px}
  .iconbtn:hover{background:var(--chip);color:var(--text)}
  .price-fresh{font-size:11px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);border:1px solid var(--text);color:var(--panel);padding:11px 18px;border-radius:var(--radius);box-shadow:0 6px 20px rgba(40,34,20,.3);z-index:80;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,-6px)}
  .toast.err{background:var(--red);border-color:var(--red)}
  .bar{height:7px;background:var(--chip);border:1px solid var(--border);border-radius:2px;overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:var(--accent)}
  .flex{display:flex;align-items:center;gap:10px}
  .warn{background:#f7efd8;border:1px solid #e0cd97;color:#7a5a12;padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-top:6px}
  .balances{display:flex;flex-wrap:wrap;gap:8px}
  .balances:empty{display:none}
  .bchip{display:flex;flex-direction:column;gap:1px;background:var(--panel2);border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;min-width:110px}
  .bchip .bl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .bchip .bv{font-size:15px;font-weight:700}
  /* dark-theme tweaks for tinted elements */
  :root[data-theme="dark"] .tag.crypto{color:#dab96a;border-color:#5a4c26;background:rgba(200,160,60,.12)}
  :root[data-theme="dark"] .tag.stock{color:#8fb4dc;border-color:#33465c;background:rgba(120,160,210,.12)}
  :root[data-theme="dark"] .tag.BUY{color:#8fb4dc} :root[data-theme="dark"] .tag.SELL{color:#d29ab8} :root[data-theme="dark"] .tag.ADJUST{color:#c0a98f}
  :root[data-theme="dark"] .reached{background:rgba(76,175,116,.14);border-color:#356b4c;color:#8fd6a8}
  :root[data-theme="dark"] .warn{background:rgba(200,160,60,.12);border-color:#6a5828;color:#d8ba70}
  /* keyboard focus (mouse users unaffected) */
  .btn:focus-visible,.tab:focus-visible,.modeseg button:focus-visible,.iconbtn:focus-visible,.seg button:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}
  /* motion: transform/opacity only, one easing curve, arrival only */
  .overlay.open .modal{animation:modalIn .18s var(--ease)}
  @keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .overlay.open .modal{animation:none}
    .toast{transition:opacity .12s}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="logo"><span class="dot"></span> CryptoLedger</div>
    <div class="modeseg" id="modeSeg">
      <button data-mode="portfolio" class="active">Portfolio</button>
      <button data-mode="goal">Goal</button>
    </div>
    <span class="tag" id="apiStatus">prices: idle</span>
    <span class="tag" id="fxStatus"></span>
    <span class="tag" id="cloudStatus" style="display:none"></span>
    <div class="spacer"></div>
    <div class="toolbar">
      <button class="btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light or dark theme">☾</button>
      <button class="btn" id="refreshBtn">↻ Refresh prices</button>
      <button class="btn primary" id="addBtn">+ Add transaction</button>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab active" data-view="dashboard">Dashboard</div>
    <div class="tab" data-view="holdings">Holdings</div>
    <div class="tab" data-view="watchlist">Watchlist</div>
    <div class="tab" data-view="ledger">Ledger</div>
    <div class="tab" data-view="settings">Settings</div>
  </div>

  <div id="view"></div>
</div>

<!-- Transaction modal -->
<div class="overlay" id="txOverlay">
  <div class="modal">
    <header><h3 id="txTitle">Add transaction</h3><div class="spacer" style="flex:1"></div>
      <button class="iconbtn" id="txClose">✕</button></header>
    <div class="body">
      <div class="seg" id="txTypeSeg">
        <button data-type="DEPOSIT" class="active">Deposit</button>
        <button data-type="WITHDRAW">Withdraw</button>
        <button data-type="BUY">Buy</button>
        <button data-type="SELL">Sell</button>
        <button data-type="ADJUST">Adjust</button>
      </div>

      <!-- available balances for the current context -->
      <div class="balances" id="balanceStrip" style="margin-top:12px"></div>

      <!-- cash fields -->
      <div id="cashFields" style="margin-top:14px">
        <div class="field">
          <label>Amount (USD)</label>
          <input type="number" id="cashAmount" placeholder="3000" step="any" min="0" />
        </div>
        <div id="cashWarn"></div>
      </div>

      <!-- trade fields -->
      <div id="tradeFields" style="display:none;margin-top:14px">
        <div class="field" id="assetPickField" style="display:none">
          <label id="assetPickLabel">Pick a holding</label>
          <select id="assetPick"></select>
        </div>
        <div class="field" id="assetTypeField">
          <label>Asset type</label>
          <div class="seg" id="assetTypeSeg">
            <button data-atype="crypto" class="active">Crypto</button>
            <button data-atype="stock">Stock</button>
          </div>
        </div>
        <div class="field">
          <label id="assetLabel">Or search a new asset</label>
          <input type="text" id="assetSearch" placeholder="e.g. bitcoin, INTC, sandisk" autocomplete="off" />
          <div class="search-results" id="searchResults"></div>
          <div class="hint" id="assetPicked"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Quantity</label><input type="number" id="qty" step="any" min="0" placeholder="20" /></div>
          <div class="field"><label>Price per unit (USD)</label><input type="number" id="price" step="any" min="0" placeholder="150" /></div>
        </div>
        <div class="row2">
          <div class="field"><label>Total (USD)</label><input type="number" id="total" step="any" min="0" placeholder="auto" /></div>
          <div class="field"><label>Fee (USD, optional)</label><input type="number" id="fee" step="any" min="0" placeholder="0" /></div>
        </div>
        <button class="btn sm" id="useLive" type="button" style="width:100%;margin-bottom:8px">Use live price</button>
        <div class="calc" id="tradeCalc">—</div>
        <div id="tradeWarn"></div>
      </div>

      <!-- adjust fields -->
      <div id="adjustFields" style="display:none;margin-top:14px">
        <div class="field">
          <label>What to adjust</label>
          <div class="seg" id="adjTargetSeg">
            <button data-adj="cash" class="active">Cash balance</button>
            <button data-adj="asset">Holding quantity</button>
          </div>
        </div>
        <div class="field" id="adjAssetField" style="display:none">
          <label>Holding</label>
          <select id="adjAsset"></select>
        </div>
        <div class="row2">
          <div class="field">
            <label>Direction</label>
            <div class="seg" id="adjDirSeg">
              <button data-dir="add" class="active">Add</button>
              <button data-dir="remove">Remove</button>
            </div>
          </div>
          <div class="field"><label id="adjAmtLabel">Amount (USD)</label><input type="number" id="adjAmount" step="any" min="0" placeholder="0" /></div>
        </div>
        <div class="calc" id="adjustCalc">—</div>
        <div id="adjustWarn"></div>
      </div>

      <div class="field" style="margin-top:14px">
        <label>Date</label>
        <input type="datetime-local" id="txDate" />
      </div>
      <div class="field">
        <label>Note (optional)</label>
        <input type="text" id="txNote" placeholder="" />
      </div>
    </div>
    <div class="foot">
      <button class="btn ghost" id="txCancel">Cancel</button>
      <button class="btn primary" id="txSave">Save transaction</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   CryptoLedger — a personal crypto + stocks trade ledger.
   Single-file, no build step, data in localStorage.
   Accounting: cash-balance model with average-cost basis.
     Net Capital = deposits - withdrawals          (your original-capital anchor)
     Equity      = cash + market value of holdings  (holdings priced live)
     Total Return= Equity - Net Capital             (P&L vs original capital)
   ========================================================================= */

const LS_KEY = "cryptoledger.v1";
const fmtUSD = (n) => (n<0?"-$":"$") + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
// Per-unit price formatter: keeps precision for small (sub-cent) prices so cheap
// tokens don't collapse to "$0.00". Used for prices/avg cost, not for USD totals.
function fmtPrice(n){
  const a=Math.abs(n); if(a===0) return "$0.00";
  const sgn=n<0?"-$":"$";
  if(a>=1)    return sgn+a.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  if(a>=0.01) return sgn+a.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:4});
  // sub-cent: show 4 significant figures, no scientific notation, trim trailing zeros
  let s=a.toPrecision(4);
  if(s.indexOf("e")>=0){ s=a.toFixed(20); }
  s=s.replace(/(\.\d*?)0+$/,"$1").replace(/\.$/,"");
  return sgn+s;
}
const fmtNum = (n,d=6) => Number(n).toLocaleString(undefined,{maximumFractionDigits:d});
const fmtPct = (n) => (n>=0?"+":"") + n.toFixed(2) + "%";
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const cls = (n) => n>0?"pos":(n<0?"neg":"neu");
const sign = (n) => (n>=0?"+":"") ;
const arrow = (n) => n>0 ? '<span class="delta">▲</span>' : (n<0 ? '<span class="delta">▼</span>' : '');

/* ---------- state ---------- */
let state = load();
let goalEditing = null;   // null | "new" | goalId — controls the goal add/edit form

function defaultState(){
  return {
    transactions: [],                 // {id,type,date,note, ... }
    assets: {},                       // assetId -> {id,type,symbol,name,coingeckoId,img}
    prices: {},                       // assetId -> {price,updatedAt}
    settings: { finnhubKey:"", autoRefreshSec:0, secondaryCurrency:"PKR", manualRate:null },
    fx: { base:"USD", rates:{}, updatedAt:null },   // USD -> other-currency rates
    goals: [],                                       // [{id,name,target,profitPct}]
    favorites: [],                                   // watchlist: [{id,type,symbol,name,coingeckoId,img}]
    equityHistory: [],                               // device-local equity snapshots [{t,v}]
    ui: { view:"dashboard", mode:"portfolio", theme:"light" }  // mode: portfolio|goal, theme: light|dark
  };
}
function normalizeState(s, keepUi){
  const d = defaultState();
  const merged = Object.assign(d, s, {
    settings: Object.assign(d.settings, s.settings||{}),
    fx: Object.assign(d.fx, s.fx||{}),
    ui: keepUi || Object.assign({view:"dashboard", mode:"portfolio", theme:"light"}, s.ui||{})
  });
  merged.goals = Array.isArray(s.goals) ? s.goals : [];
  // migrate the old single-goal shape ({target,profitPct}) into the list
  if(merged.goals.length===0 && s.goal && s.goal.target>0){
    merged.goals = [{ id: s.goal.id||uid(), name:"Goal", target:s.goal.target, profitPct:s.goal.profitPct||10 }];
  }
  delete merged.goal;
  merged.favorites = Array.isArray(s.favorites) ? s.favorites : [];
  merged.equityHistory = Array.isArray(s.equityHistory) ? s.equityHistory : [];
  return merged;
}

/* ---------- secondary currency (e.g. PKR) ---------- */
function secCode(){ return (state.settings && state.settings.secondaryCurrency) || "PKR"; }
function rateIsManual(){ const m = state.settings && state.settings.manualRate; return typeof m==="number" && m>0; }
function fetchedRate(){ const c = secCode(); return state.fx && state.fx.rates && state.fx.rates[c]!=null ? state.fx.rates[c] : null; }
function secRate(){ return rateIsManual() ? state.settings.manualRate : fetchedRate(); }
// Format a USD amount in the secondary currency (returns "" if no rate yet).
function fmtSec(usd){
  const r = secRate(); if(r==null) return "";
  const code = secCode(), v = usd*r;
  try{ return (v<0?"-":"") + new Intl.NumberFormat(undefined,{style:"currency",currency:code,maximumFractionDigits:0}).format(Math.abs(v)); }
  catch(e){ return (v<0?"-":"") + code + " " + Math.abs(v).toLocaleString(undefined,{maximumFractionDigits:0}); }
}
// A "≈ ₨…" sub-line for a dashboard figure; colored to match a P&L value when asked.
function secLine(usd, colored){
  const r = secRate(); if(r==null) return "";

}
async function fetchFx(){
  try{
    const r = await fetch("https://open.er-api.com/v6/latest/USD");
    const j = await r.json();
    if(j && j.rates && j.rates[secCode()]!=null){
      state.fx = { base:"USD", rates:j.rates, updatedAt:new Date().toISOString() };
      save(); updateFxChip(); return true;
    }
  }catch(e){}
  return false;
}
function updateFxChip(){
  const el = document.getElementById("fxStatus"); if(!el) return;
  const r = secRate();
  el.textContent = r!=null ? `USD/${secCode()} ${r.toLocaleString(undefined,{maximumFractionDigits:2})}${rateIsManual()?" · manual":""}` : `${secCode()}: no rate`;

/* ---------- accounting engine ---------- */
// Replays the whole ledger in chronological order and returns derived figures.
// Pass excludeId to ignore one transaction (used while editing it, so balance
// checks reflect the ledger *without* the entry being changed).
function computePortfolio(excludeId){
  const txns = [...state.transactions].filter(t=>t.id!==excludeId).sort((a,b)=>{
    const d = new Date(a.date) - new Date(b.date);
    return d !== 0 ? d : (a._seq||0) - (b._seq||0);
  });
  let cash=0, deposits=0, withdrawals=0, realized=0, feesPaid=0;
  const pos = {}; // assetId -> {qty, costBasis}
  const trades = [];

  for(const t of txns){
    if(t.type==="DEPOSIT"){ cash += t.amount; deposits += t.amount; }
    else if(t.type==="WITHDRAW"){ cash -= t.amount; withdrawals += t.amount; }
    else if(t.type==="BUY"){
      const gross = t.qty*t.price, fee = t.fee||0;
      cash -= (gross + fee); feesPaid += fee;
      const p = pos[t.assetId] || (pos[t.assetId]={qty:0,costBasis:0});
      p.qty += t.qty; p.costBasis += gross + fee;   // fee capitalized into basis
    }
    else if(t.type==="SELL"){
      const gross = t.qty*t.price, fee = t.fee||0;
      cash += (gross - fee); feesPaid += fee;
      const p = pos[t.assetId] || (pos[t.assetId]={qty:0,costBasis:0});
      const avg = p.qty>0 ? p.costBasis/p.qty : 0;
      const basisSold = avg * t.qty;
      realized += (gross - fee) - basisSold;
      p.qty -= t.qty; p.costBasis -= basisSold;
      if(p.qty < 1e-9){ p.qty=0; p.costBasis=0; }
    }
    else if(t.type==="ADJUST"){
      if(t.target==="cash"){ cash += t.delta; }         // delta signed: +add / -remove
      else {                                             // asset quantity adjustment
        const p = pos[t.assetId] || (pos[t.assetId]={qty:0,costBasis:0});
        if(t.qtyDelta >= 0){                             // bonus/airdrop units come in at $0 cost
          p.qty += t.qtyDelta;
        } else {                                         // remove units at average cost, no realized P&L
          const removeQ = Math.min(-t.qtyDelta, p.qty);
          const avg = p.qty>0 ? p.costBasis/p.qty : 0;
          p.qty -= removeQ; p.costBasis -= avg*removeQ;
        }
        if(p.qty < 1e-9){ p.qty=0; p.costBasis=0; }
      }
    }
  }

  // build holdings with live prices
  let holdingsValue=0, holdingsCost=0, unrealized=0;
  const holdings=[];
  for(const [assetId,p] of Object.entries(pos)){
    if(p.qty<=1e-9) continue;
    const asset = state.assets[assetId] || {symbol:assetId,type:"?"};
    const pr = state.prices[assetId];
    const live = pr ? pr.price : null;
    const avg = p.costBasis/p.qty;
    const mkt = live!=null ? live*p.qty : null;
    const uPnl = mkt!=null ? mkt - p.costBasis : null;
    holdingsValue += mkt!=null ? mkt : p.costBasis;   // fall back to cost if no price
    holdingsCost  += p.costBasis;
    if(uPnl!=null) unrealized += uPnl;
    holdings.push({assetId,asset,qty:p.qty,avgCost:avg,costBasis:p.costBasis,live,marketValue:mkt,unrealized:uPnl,updatedAt:pr?pr.updatedAt:null});
  }
  holdings.sort((a,b)=> (b.marketValue||b.costBasis) - (a.marketValue||a.costBasis));

  const netCapital = deposits - withdrawals;
  const equity = cash + holdingsValue;
  const totalReturn = equity - netCapital;
  const totalReturnPct = netCapital>0 ? (totalReturn/netCapital*100) : 0;

  // Break-even price per holding: the price this asset must reach for total
  // equity to equal net capital, with cash and every other position held constant.
  //   restOfAccount = equity - this holding's current contribution
  //   breakevenPrice = (netCapital - restOfAccount) / qty
  for(const h of holdings){
    const contrib = h.marketValue!=null ? h.marketValue : h.costBasis;
    const restOfAccount = equity - contrib;
    h.breakevenPrice = h.qty>0 ? (netCapital - restOfAccount)/h.qty : null;
  }

  return {cash,deposits,withdrawals,netCapital,realized,feesPaid,holdings,holdingsValue,holdingsCost,unrealized,equity,totalReturn,totalReturnPct,positions:pos};
}

// current net quantity held for an asset (incl. buys, sells and adjustments)
function heldQty(assetId, excludeId){
  const p = computePortfolio(excludeId).positions[assetId];
  return p ? p.qty : 0;
}
// list of assets currently held (qty > 0), for the adjust dropdown
function heldAssets(excludeId){
  const pos = computePortfolio(excludeId).positions;
  return Object.keys(pos).filter(id=>pos[id].qty>1e-9).map(id=>state.assets[id]).filter(Boolean);
}

// number of compounding X%-profit trades to grow `from` up to `to`
function tradesToGoal(from, to, pct){
  if(!(from>0) || !(to>from) || !(pct>0)) return null;
  return Math.ceil(Math.log(to/from) / Math.log(1 + pct/100));
}

// progress-ring SVG at a given size
function ringSVG(progress, reached, size, stroke){
  const R = size/2 - stroke/2 - 2, C = 2*Math.PI*R, off = C*(1-progress/100), c = size/2;
  const color = reached ? "var(--green)" : "url(#gGrad)";
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <defs><linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fb950"/><stop offset="100%" stop-color="#2ea043"/></linearGradient></defs>
    <circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="var(--chip)" stroke-width="${stroke}"/>
    <circle cx="${c}" cy="${c}" r="${R}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>`;
}

/* ---------- equity history + chart ---------- */
// Record a real market-equity snapshot (device-local, throttled).
function recordEquityPoint(){
  const eq = computePortfolio().equity;
  if(!isFinite(eq)) return;
  const now = Date.now();
  const h = state.equityHistory || (state.equityHistory=[]);
  const last = h[h.length-1];
  if(last && (now-last.t) < 15*60*1000 && Math.abs(eq-last.v) < Math.max(0.01, Math.abs(last.v)*0.0005)) return;
  h.push({ t:now, v:+eq.toFixed(2) });
  if(h.length>1000) h.splice(0, h.length-1000);
  persistLocal();
}
// Build the series: book value (cash + cost basis) reconstructed at each ledger
// event, plus recorded live snapshots, plus the current live equity. All real.
function equitySeries(currentEquity){
  const txns=[...state.transactions].sort((a,b)=> (new Date(a.date)-new Date(b.date)) || ((a._seq||0)-(b._seq||0)));
  let cash=0; const pos={}; const pts=[];
  const costTotal=()=>Object.values(pos).reduce((s,p)=> s + Math.max(0,p.costBasis), 0);
  for(const t of txns){
    if(t.type==="DEPOSIT") cash+=t.amount;
    else if(t.type==="WITHDRAW") cash-=t.amount;
    else if(t.type==="BUY"){ const g=t.qty*t.price+(t.fee||0); cash-=g; const p=pos[t.assetId]||(pos[t.assetId]={qty:0,costBasis:0}); p.qty+=t.qty; p.costBasis+=g; }
    else if(t.type==="SELL"){ const g=t.qty*t.price-(t.fee||0); cash+=g; const p=pos[t.assetId]||(pos[t.assetId]={qty:0,costBasis:0}); const avg=p.qty>0?p.costBasis/p.qty:0; p.qty-=t.qty; p.costBasis-=avg*t.qty; if(p.qty<1e-9){p.qty=0;p.costBasis=0;} }
    else if(t.type==="ADJUST"){ if(t.target==="cash") cash+=t.delta; else { const p=pos[t.assetId]||(pos[t.assetId]={qty:0,costBasis:0}); if(t.qtyDelta>=0)p.qty+=t.qtyDelta; else { const rq=Math.min(-t.qtyDelta,p.qty); const avg=p.qty>0?p.costBasis/p.qty:0; p.qty-=rq; p.costBasis-=avg*rq;} if(p.qty<1e-9){p.qty=0;p.costBasis=0;} } }
    pts.push({ t:new Date(t.date).getTime(), v:+(cash+costTotal()).toFixed(2) });
  }
  for(const s of (state.equityHistory||[])) pts.push({ t:s.t, v:s.v });
  pts.push({ t:Date.now(), v:+(currentEquity!=null?currentEquity:computePortfolio().equity).toFixed(2) });
  pts.sort((a,b)=>a.t-b.t);
  // collapse points sharing the same timestamp (keep the last)
  const out=[]; for(const p of pts){ if(out.length && out[out.length-1].t===p.t) out[out.length-1]=p; else out.push(p); }
  return out;
}
function equityRangeLabel(){
  const s=equitySeries();
  if(s.length<2) return "";
  const fmt=t=>new Date(t).toLocaleDateString([], {month:'short',day:'2-digit',year:'2-digit'});
  return `${fmt(s[0].t)} – ${fmt(s[s.length-1].t)}`;
}
function equityChartHTML(currentEquity){
  const s=equitySeries(currentEquity);
  if(s.length<2) return emptyBlock("📉","Not enough history yet","The equity curve fills in as you record trades and refresh prices over time.");
  const W=800, H=170, padL=6, padR=6, padT=14, padB=16;
  const w=W-padL-padR, h=H-padT-padB;
  const tMin=s[0].t, tMax=s[s.length-1].t;
  const vals=s.map(p=>p.v); let vMin=Math.min(...vals), vMax=Math.max(...vals);
  if(vMin===vMax){ vMin-=Math.max(1,Math.abs(vMin)*0.02); vMax+=Math.max(1,Math.abs(vMax)*0.02); }
  const padv=(vMax-vMin)*0.10; vMin-=padv; vMax+=padv;
  const X=t=> padL + (tMax===tMin?0:(t-tMin)/(tMax-tMin))*w;
  const Y=v=> padT + (1-(v-vMin)/(vMax-vMin))*h;
  const line=s.map((p,i)=>`${i?"L":"M"}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join(" ");
  const area=`${line} L${X(s[s.length-1].t).toFixed(1)},${(padT+h).toFixed(1)} L${X(s[0].t).toFixed(1)},${(padT+h).toFixed(1)} Z`;
  const first=s[0].v, last=s[s.length-1].v, chg=last-first, chgPct=first!==0?chg/Math.abs(first)*100:0;
  const up=chg>=0;
  const stroke=up?"var(--green)":"var(--red)";
  const lastX=X(s[s.length-1].t), lastY=Y(last);
  return `
    <div style="padding:14px 16px 8px">
      <div class="flex" style="justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:8px">
        <div><span class="bignum">${fmtUSD(last)}</span>
          <span class="${cls(chg)}" style="font-weight:700;margin-left:6px">${arrow(chg)}${fmtUSD(Math.abs(chg))} (${fmtPct(chgPct)})</span>
          <div class="muted" style="font-size:12px">change over shown range</div></div>
        <div class="muted" style="font-size:12px;text-align:right">high ${fmtUSD(Math.max(...vals))}<br>low ${fmtUSD(Math.min(...vals))}</div>
      </div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:170px;display:block">
        <defs><linearGradient id="eqFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${up?'var(--green)':'var(--red)'}" stop-opacity="0.22"/>
          <stop offset="100%" stop-color="${up?'var(--green)':'var(--red)'}" stop-opacity="0"/></linearGradient></defs>
        <line x1="${padL}" y1="${padT}" x2="${W-padR}" y2="${padT}" stroke="var(--border)" stroke-width="1"/>
        <line x1="${padL}" y1="${padT+h}" x2="${W-padR}" y2="${padT+h}" stroke="var(--border)" stroke-width="1"/>
        <path d="${area}" fill="url(#eqFill)"/>
        <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3.5" fill="${stroke}"/>
      </svg>
      <div class="muted" style="font-size:11.5px;margin-top:2px">Live points are recorded as you refresh prices; earlier points are valued at cost.</div>
    </div>`;
}

function freshnessText(holdings){

  const latest = Math.max(...times);

/* ---------- price fetching ---------- */
// Assets to price = current holdings + watchlist favorites (deduped by id).
function priceTargets(){
  const map={};
  const positions = computePortfolio().positions;
  for(const a of Object.values(state.assets)){ const p=positions[a.id]; if(p && p.qty>1e-9) map[a.id]=a; }
  for(const f of (state.favorites||[])){ if(f && f.id) map[f.id]=f; }
  return Object.values(map);
}
async function refreshPrices(){
  const status = document.getElementById("apiStatus");
  await fetchFx();                       // keep USD -> secondary-currency rate fresh
  const targets = priceTargets();
  const cryptoIds = new Set(), stocks = [];
  for(const a of targets){
    if(a.type==="crypto" && a.coingeckoId) cryptoIds.add(a.coingeckoId);
    else if(a.type==="stock") stocks.push(a);
  }
  if(!cryptoIds.size && !stocks.length){ status.textContent="prices: nothing to price"; render(); return; }
  status.textContent="prices: updating…";
  let ok=0, fail=0;
  try{
    if(cryptoIds.size){
      const url = `https://api.coingecko.com/api/v3/simple/price?ids=${[...cryptoIds].join(",")}&vs_currencies=usd`;
      const r = await fetch(url); const j = await r.json();
      for(const a of targets){
        if(a.type==="crypto" && a.coingeckoId && j[a.coingeckoId] && j[a.coingeckoId].usd!=null){
          state.prices[a.id]={price:j[a.coingeckoId].usd, updatedAt:new Date().toISOString()}; ok++;
        }
      }
    }
    if(stocks.length){
      const key = state.settings.finnhubKey;
      if(!key){ fail+=stocks.length; }
      else{
        for(const a of stocks){
          try{
            const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(a.symbol.toUpperCase())}&token=${encodeURIComponent(key)}`);
            const j = await r.json();
            if(j && typeof j.c==="number" && j.c>0){ state.prices[a.id]={price:j.c, updatedAt:new Date().toISOString()}; ok++; }
            else fail++;
          }catch(e){ fail++; }
        }
      }
    }
    save();
    recordEquityPoint();                 // capture a real equity snapshot with fresh prices
    status.textContent = `prices: ${ok} ok${fail?`, ${fail} failed`:''}`;
    if(fail && stocks.length && !state.settings.finnhubKey) toast("Add a Finnhub key in Settings for stock prices", true);
    render();
  }catch(e){
    status.textContent="prices: error";
    toast("Price fetch failed: "+e.message, true);
  }
}

/* ---------- transaction modal ---------- */
const overlay = document.getElementById("txOverlay");
let modalType="DEPOSIT", modalAssetType="crypto", pickedAsset=null, editingId=null, searchTimer=null;
let adjTarget="cash", adjDir="add";

// txn: pass an existing transaction (with id) to edit, or a prefill object
// {type, assetId, qty?, price?} with no id to start a new one pre-filled.
function openModal(txn){
  editingId = (txn && txn.id) ? txn.id : null;
  document.getElementById("txTitle").textContent = editingId ? "Edit transaction" : "Add transaction";
  // defaults
  modalType = txn? txn.type : "DEPOSIT";
  pickedAsset = (txn && txn.asset) ? txn.asset : (txn && txn.assetId ? state.assets[txn.assetId] : null);
  modalAssetType = pickedAsset ? pickedAsset.type : "crypto";
  setSeg("txTypeSeg","type",modalType);
  setSeg("assetTypeSeg","atype",modalAssetType);
  document.getElementById("cashAmount").value = txn && (txn.type==="DEPOSIT"||txn.type==="WITHDRAW")? txn.amount : "";
  document.getElementById("assetSearch").value = pickedAsset && txn && txn.type!=="ADJUST"? `${(pickedAsset.symbol||"").toUpperCase()} — ${pickedAsset.name||""}` : "";
  document.getElementById("qty").value = txn && txn.qty!=null? txn.qty : "";
  document.getElementById("price").value = txn && txn.price!=null? txn.price : "";
  document.getElementById("total").value = (txn && txn.qty>0 && txn.price>0) ? +(txn.qty*txn.price).toFixed(2) : "";
  document.getElementById("fee").value = txn && txn.fee? txn.fee : "";
  document.getElementById("txNote").value = txn? (txn.note||"") : "";
  document.getElementById("txDate").value = toLocalInput(txn? txn.date : new Date().toISOString());
  document.getElementById("searchResults").classList.remove("open");
  document.getElementById("assetPicked").textContent = pickedAsset && (!txn||txn.type!=="ADJUST")? `Tracking ${(pickedAsset.symbol||"").toUpperCase()} (${pickedAsset.type})` : "";
  // adjust defaults
  if(txn && txn.type==="ADJUST"){
    adjTarget = txn.target==="cash" ? "cash" : "asset";
    adjDir = (txn.target==="cash" ? txn.delta : txn.qtyDelta) >= 0 ? "add" : "remove";
    document.getElementById("adjAmount").value = Math.abs(txn.target==="cash" ? txn.delta : txn.qtyDelta);
  } else {
    adjTarget="cash"; adjDir="add"; document.getElementById("adjAmount").value="";
  }
  setSeg("adjTargetSeg","adj",adjTarget);
  setSeg("adjDirSeg","dir",adjDir);
  populateAdjAssets(txn && txn.type==="ADJUST" ? txn.assetId : null);
  updateModalMode(); updateTradeCalc(); updateAdjustCalc();
  overlay.classList.add("open");
}
function closeModal(){ overlay.classList.remove("open"); }

function updateModalMode(){
  const isCash = modalType==="DEPOSIT"||modalType==="WITHDRAW";

// Quick-pick dropdown: your holdings (for Sell) or holdings + watchlist (for Buy).
function populateAssetPick(){
  const field=document.getElementById("assetPickField"), sel=document.getElementById("assetPick");
  const label=document.getElementById("assetPickLabel");
  let list;
  if(modalType==="SELL"){ label.textContent="Pick a holding to sell"; list=heldAssets(editingId); }
  else { // BUY: everything you hold or watch, deduped
    label.textContent="Pick an existing asset";
    const map={}; heldAssets(editingId).forEach(a=>map[a.id]=a);
    (state.favorites||[]).forEach(f=>{ if(!map[f.id]) map[f.id]=f; });

  }
  if(!list.length){ field.style.display="none"; sel.innerHTML=""; return; }
  field.style.display="block";

// Shows available cash / units for the current transaction context.
function updateBalanceStrip(){
  const strip=document.getElementById("balanceStrip");
  const p=computePortfolio(editingId);
  const chips=[];
  const cashChip=`<div class="bchip"><span class="bl">Available cash</span><span class="bv ${p.cash<0?'neg':''}">${fmtUSD(p.cash)}</span></div>`;
  function heldChip(asset){
    if(!asset) return "";
    const pos=p.positions[asset.id]; const q=pos?pos.qty:0;
    const pr=state.prices[asset.id]; const val=pr?q*pr.price:null;
    return `<div class="bchip"><span class="bl">You hold · ${(asset.symbol||"").toUpperCase()}</span><span class="bv">${fmtNum(q)}${val!=null?` <small class="muted">(${fmtUSD(val)})</small>`:''}</span></div>`;
  }
  if(modalType==="DEPOSIT"||modalType==="WITHDRAW"){ chips.push(cashChip); }
  else if(modalType==="BUY"){ chips.push(cashChip); if(pickedAsset) chips.push(heldChip(pickedAsset)); }
  else if(modalType==="SELL"){ if(pickedAsset) chips.push(heldChip(pickedAsset)); chips.push(cashChip); }
  else if(modalType==="ADJUST"){
    if(adjTarget==="cash") chips.push(cashChip);
    else { const sel=document.getElementById("adjAsset"); const a=sel&&sel.value?state.assets[sel.value]:null; chips.push(heldChip(a)); }
  }
  strip.innerHTML=chips.join("");
}

function updateAdjustCalc(){
  if(modalType!=="ADJUST") return;
  const el=document.getElementById("adjustCalc"), warn=document.getElementById("adjustWarn");
  warn.innerHTML="";
  const amt=parseFloat(document.getElementById("adjAmount").value)||0;
  const p=computePortfolio(editingId);
  if(adjTarget==="cash"){
    const after = p.cash + (adjDir==="add"? amt : -amt);
    el.innerHTML=`Cash ${adjDir==="add"?"→ increases":"→ decreases"} by <b>${fmtUSD(amt)}</b> &nbsp;·&nbsp; cash after: <b class="${after<0?'neg':''}">${fmtUSD(after)}</b>`;
    if(adjDir==="remove" && amt>p.cash+1e-9) warn.innerHTML=`<div class="warn">You can't remove more than your available cash (${fmtUSD(p.cash)}).</div>`;
    else el.innerHTML+=` <small class="muted">— counts toward return, not net capital (use Deposit/Withdraw for your own capital).</small>`;
  } else {
    const sel=document.getElementById("adjAsset"); const a=sel&&sel.value?state.assets[sel.value]:null;
    const held=a? (p.positions[a.id]?p.positions[a.id].qty:0) : 0;
    const after = held + (adjDir==="add"? amt : -amt);
    el.innerHTML= a? `${(a.symbol||"").toUpperCase()} ${adjDir==="add"?"+":"−"}${fmtNum(amt)} units &nbsp;·&nbsp; holding after: <b>${fmtNum(after)}</b>` : "Pick a holding to adjust.";
    if(a && adjDir==="remove" && amt>held+1e-9) warn.innerHTML=`<div class="warn">You only hold ${fmtNum(held)} units of ${(a.symbol||"").toUpperCase()}.</div>`;
    else if(a && adjDir==="add") el.innerHTML+=` <small class="muted">— added at $0 cost (e.g. airdrop/bonus); raises equity/return.</small>`;
    else if(a && adjDir==="remove") el.innerHTML+=` <small class="muted">— removed at average cost, no realized P&L.</small>`;
  }
}
function toLocalInput(iso){
  const d=new Date(iso); const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

// Keep quantity / price / total consistent: given the field just edited and one
// other value present, compute the third. (total = qty × price)
function syncTriad(edited){
  const qEl=document.getElementById("qty"), pEl=document.getElementById("price"), tEl=document.getElementById("total");
  const q=parseFloat(qEl.value), p=parseFloat(pEl.value), t=parseFloat(tEl.value);
  const ok=x=>Number.isFinite(x)&&x>0;
  const trim=(x,d)=>Number.isFinite(x)?String(+x.toFixed(d)):"";
  if(edited==="qty"){
    if(ok(q)&&ok(p)) tEl.value=trim(q*p,2);
    else if(ok(q)&&ok(t)) pEl.value=trim(t/q,8);
  } else if(edited==="price"){
    if(ok(p)&&ok(q)) tEl.value=trim(q*p,2);
    else if(ok(p)&&ok(t)) qEl.value=trim(t/p,8);
  } else if(edited==="total"){
    if(ok(t)&&ok(p)) qEl.value=trim(t/p,8);
    else if(ok(t)&&ok(q)) pEl.value=trim(t/q,8);
  }
  updateTradeCalc();
}

function updateTradeCalc(){
  updateBalanceStrip();
  const cashWarn=document.getElementById("cashWarn"); cashWarn.innerHTML="";
  if(modalType==="WITHDRAW"){
    const amt=parseFloat(document.getElementById("cashAmount").value)||0;
    const avail=computePortfolio(editingId).cash;
    if(amt>avail+1e-9) cashWarn.innerHTML=`<div class="warn">You only have ${fmtUSD(avail)} in cash to withdraw.</div>`;
  }
  const el=document.getElementById("tradeCalc"), warn=document.getElementById("tradeWarn");
  warn.innerHTML="";
  if(modalType==="DEPOSIT"||modalType==="WITHDRAW"||modalType==="ADJUST"){ return; }
  const qty=parseFloat(document.getElementById("qty").value)||0;
  const price=parseFloat(document.getElementById("price").value)||0;
  const fee=parseFloat(document.getElementById("fee").value)||0;
  const gross=qty*price;
  const p=computePortfolio(editingId);
  if(modalType==="BUY"){
    const total=gross+fee;
    el.innerHTML=`Cost: <b>${fmtUSD(total)}</b> (${fmtNum(qty)} × ${fmtPrice(price)}${fee?` + ${fmtUSD(fee)} fee`:''}) &nbsp;·&nbsp; cash after: <b class="${(p.cash-total)<0?'neg':''}">${fmtUSD(p.cash-total)}</b>`;
    if(total>p.cash+1e-9) warn.innerHTML=`<div class="warn">This buy exceeds your available cash (${fmtUSD(p.cash)}). It's allowed, but your cash will go negative.</div>`;
  }else{
    const proceeds=gross-fee;
    let basisSold=0, held=0;
    if(pickedAsset){ const pos=p.positions[pickedAsset.id]; held = pos?pos.qty:0; const avg=pos&&pos.qty>0?pos.costBasis/pos.qty:0; basisSold=avg*qty; }
    const realized=proceeds-basisSold;
    el.innerHTML=`Proceeds: <b>${fmtUSD(proceeds)}</b> &nbsp;·&nbsp; realized P&L: <b class="${cls(realized)}">${sign(realized)}${fmtUSD(realized)}</b>`;
    if(pickedAsset && qty>held+1e-9) warn.innerHTML=`<div class="warn">You only hold ${fmtNum(held)} units of ${(pickedAsset.symbol||"").toUpperCase()}. Selling more than held isn't allowed.</div>`;
  }
}

/* asset search (CoinGecko for crypto, Finnhub for stocks) — reusable */
async function searchAssets(q, assetType){
  if(assetType==="crypto"){
    const r=await fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(q)}`);
    const j=await r.json();
    return (j.coins||[]).slice(0,8).map(c=>({type:"crypto",symbol:c.symbol,name:c.name,coingeckoId:c.id,img:c.thumb}));
  }
  const key=state.settings.finnhubKey;
  if(!key) return [{type:"stock",symbol:q.toUpperCase(),name:q.toUpperCase(),coingeckoId:null,img:null,_noKey:true}];
  const r=await fetch(`https://finnhub.io/api/v1/search?q=${encodeURIComponent(q)}&token=${encodeURIComponent(key)}`);
  const j=await r.json();
  let items=(j.result||[]).filter(x=>!x.symbol.includes(".")).slice(0,8).map(x=>({type:"stock",symbol:x.symbol,name:x.description,coingeckoId:null,img:null}));
  if(!items.length) items=[{type:"stock",symbol:q.toUpperCase(),name:q.toUpperCase(),coingeckoId:null,img:null}];
  return items;
}
function assetFromItem(it){
  return { id:`${it.type}:${it.symbol.toUpperCase()}`, type:it.type, symbol:it.symbol.toUpperCase(), name:it.name, coingeckoId:it.coingeckoId, img:it.img };
}
async function doAssetSearch(q){
  const box=document.getElementById("searchResults");
  if(!q || q.length<2){ box.classList.remove("open"); box.innerHTML=""; return; }
  box.innerHTML=`<div class="sr-item muted">Searching…</div>`; box.classList.add("open");
  try{
    const items=await searchAssets(q, modalAssetType);
    box.innerHTML = items.map((it,i)=>`<div class="sr-item" data-i="${i}">
       ${it.img?`<img src="${it.img}">`:`<div class="badge" style="width:22px;height:22px;font-size:10px">${it.symbol.slice(0,3).toUpperCase()}</div>`}
       <div><b>${it.symbol.toUpperCase()}</b> <small class="muted">${it.name||""}</small></div></div>`).join("");
    box._items=items;
    box.querySelectorAll(".sr-item[data-i]").forEach(el=>el.onclick=()=>{
      const it=box._items[parseInt(el.dataset.i,10)];
      pickedAsset = assetFromItem(it);
      document.getElementById("assetSearch").value=`${pickedAsset.symbol} — ${pickedAsset.name||""}`;
      document.getElementById("assetPicked").textContent=`Tracking ${pickedAsset.symbol} (${pickedAsset.type})`;
      const sel=document.getElementById("assetPick"); if(sel) sel.value="";
      box.classList.remove("open");
      updateTradeCalc();
    });
  }catch(e){ box.innerHTML=`<div class="sr-item muted">Search failed: ${e.message}</div>`; }
}

async function useLivePrice(){
  if(!pickedAsset){ toast("Pick an asset first", true); return; }
  try{
    let price=null;
    if(pickedAsset.type==="crypto" && pickedAsset.coingeckoId){
      const r=await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${pickedAsset.coingeckoId}&vs_currencies=usd`);
      const j=await r.json(); price=j[pickedAsset.coingeckoId]?.usd;
    }else if(pickedAsset.type==="stock"){
      const key=state.settings.finnhubKey; if(!key){ toast("Add a Finnhub key in Settings", true); return; }
      const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(pickedAsset.symbol)}&token=${encodeURIComponent(key)}`);
      const j=await r.json(); price=j.c;
    }
    if(price>0){ document.getElementById("price").value=price; syncTriad("price"); toast(`Live ${pickedAsset.symbol}: ${fmtPrice(price)}`); }
    else toast("Couldn't get a live price", true);
  }catch(e){ toast("Live price failed: "+e.message, true); }
}

function saveTransaction(){
  const dateVal=document.getElementById("txDate").value;
  const date = dateVal? new Date(dateVal).toISOString() : new Date().toISOString();
  const note=document.getElementById("txNote").value.trim();
  let txn;
  if(modalType==="DEPOSIT"||modalType==="WITHDRAW"){
    const amount=parseFloat(document.getElementById("cashAmount").value);
    if(!(amount>0)){ toast("Enter a positive amount", true); return; }
    if(modalType==="WITHDRAW"){
      const avail=computePortfolio(editingId).cash;
      if(amount>avail+1e-9){ toast(`Can't withdraw ${fmtUSD(amount)}; only ${fmtUSD(avail)} in cash`, true); return; }
    }
    txn={type:modalType, amount, date, note};
  }else if(modalType==="ADJUST"){
    const amount=parseFloat(document.getElementById("adjAmount").value);
    if(!(amount>0)){ toast("Enter a positive amount", true); return; }
    const p=computePortfolio(editingId);
    if(adjTarget==="cash"){
      if(adjDir==="remove" && amount>p.cash+1e-9){ toast(`Can't remove ${fmtUSD(amount)}; only ${fmtUSD(p.cash)} in cash`, true); return; }
      txn={type:"ADJUST", target:"cash", delta:(adjDir==="add"?amount:-amount), date, note};
    }else{
      const sel=document.getElementById("adjAsset"); const assetId=sel&&sel.value;
      if(!assetId){ toast("No holding selected to adjust", true); return; }
      const held=p.positions[assetId]?p.positions[assetId].qty:0;
      if(adjDir==="remove" && amount>held+1e-9){ toast(`Can't remove ${fmtNum(amount)}; you only hold ${fmtNum(held)}`, true); return; }
      txn={type:"ADJUST", target:"asset", assetId, qtyDelta:(adjDir==="add"?amount:-amount), date, note};
    }
  }else{
    if(!pickedAsset){ toast("Search and pick an asset", true); return; }
    const qty=parseFloat(document.getElementById("qty").value);
    const price=parseFloat(document.getElementById("price").value);
    const fee=parseFloat(document.getElementById("fee").value)||0;
    if(!(qty>0)){ toast("Enter a positive quantity", true); return; }
    if(!(price>0)){ toast("Enter a positive price", true); return; }
    if(modalType==="SELL"){
      // validate against held qty (incl. adjustments), excluding the transaction being edited
      const pos=computePortfolio(editingId).positions[pickedAsset.id];
      const held=pos?pos.qty:0;
      if(qty>held+1e-9){ toast(`Can't sell ${fmtNum(qty)}; you only hold ${fmtNum(held)}`, true); return; }
    }
    // register asset
    state.assets[pickedAsset.id]=pickedAsset;
    txn={type:modalType, assetId:pickedAsset.id, qty, price, fee, date, note};
  }
  if(editingId){
    const idx=state.transactions.findIndex(t=>t.id===editingId);
    txn.id=editingId; txn._seq=state.transactions[idx]._seq;
    state.transactions[idx]=txn;
  }else{
    txn.id=uid(); txn._seq=state.transactions.length;
    state.transactions.push(txn);
  }
  save(); closeModal(); render(); toast("Transaction saved"); refreshPrices();
}

/* ---------- export / import ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`cryptoledger-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const s=JSON.parse(rd.result);
      if(!s.transactions) throw new Error("not a CryptoLedger backup");
      state=Object.assign(defaultState(),s); save(); render(); toast("Data imported"); refreshPrices();
    }catch(e){ toast("Import failed: "+e.message, true); } };
    rd.readAsText(f); };
  inp.click();
}

// Open a pre-filled new transaction for a specific holding.
function openHoldingTxn(assetId, type, closeAll){
  const asset=state.assets[assetId]; if(!asset) return;
  const prefill={type, assetId};
  // Note: price is left blank on purpose — you enter the price you actually
  // bought/sold at. Use the "Use live price" button if you want the market price.
  if(closeAll){
    const pos=computePortfolio().positions[assetId];
    prefill.qty = pos? pos.qty : 0;              // sell the whole position
  }
  openModal(prefill);
}

// event delegation for ledger + dynamically-rendered buttons
viewEl.addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"); const del=e.target.closest("[data-del]");
  const buy=e.target.closest("[data-buy]"), sell=e.target.closest("[data-sell]"), close=e.target.closest("[data-close]");
  if(buy){ openHoldingTxn(buy.dataset.buy,"BUY",false); return; }
  if(sell){ openHoldingTxn(sell.dataset.sell,"SELL",false); return; }
  if(close){ openHoldingTxn(close.dataset.close,"SELL",true); return; }
  if(ed){ const t=state.transactions.find(x=>x.id===ed.dataset.edit); if(t) openModal(t); return; }
  if(del){ const id=del.dataset.del; if(confirm("Delete this transaction?")){ state.transactions=state.transactions.filter(x=>x.id!==id); save(); render(); toast("Deleted"); } return; }
  if(e.target.id==="exportBtn") exportData();
  if(e.target.id==="importBtn") importData();
  if(e.target.id==="addBtn2") openModal(null);
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && overlay.classList.contains("open")) closeModal(); });

/* ---------- boot ---------- */
applyTheme();
recordEquityPoint();
render();
setupAutoRefresh();
updateFxChip();
fetchFx().then(()=>render());          // load USD->secondary rate, then show PKR lines
if(state.transactions.length) refreshPrices();
</script>

      setDoc(ref, payload).then(()=>window.setCloudStatus("synced"))
                          .catch(()=>window.setCloudStatus("sync error"));
    }
    // called by save() on every local change
    window.Cloud.onLocalSave = ()=>{
      if(applying || !ref) return;
      window.setCloudStatus("saving…");
      clearTimeout(pushTimer); pushTimer=setTimeout(pushNow, 800);

    function subscribe(){
      if(unsub) unsub();
      unsub = onSnapshot(ref, snap=>{

        const remote = snap.data();
        if(remote.updatedAt && remote.updatedAt===lastPushedAt) return;  // echo of our write
        applying=true;
        try{ window.applyCloudState(remote); } finally{ applying=false; }
        window.setCloudStatus("synced");
      }, ()=>window.setCloudStatus("sync error"));
    }

    onAuthStateChanged(auth, async (user)=>{
