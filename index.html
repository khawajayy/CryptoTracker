<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CryptoLedger — Portfolio &amp; Trade Tracker</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="wrap">
  <header class="app" aria-label="CryptoLedger toolbar">
    <div class="logo"><span class="dot"></span> CryptoLedger</div>
    <div class="modeseg" id="modeSeg">
      <button type="button" data-mode="portfolio" class="active">Portfolio</button>
      <button type="button" data-mode="goal">Goal</button>
    </div>
    <span class="tag" id="apiStatus">prices: idle</span>
    <span class="tag" id="fxStatus"></span>
    <span class="tag" id="cloudStatus" style="display:none"></span>
    <div class="spacer"></div>
    <div class="toolbar">
      <button type="button" class="btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle light or dark theme">☾</button>
      <button type="button" class="btn" id="refreshBtn">↻ Refresh prices</button>
      <button type="button" class="btn primary" id="addBtn">+ Add transaction</button>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab active" data-view="dashboard">Dashboard</div>
    <div class="tab" data-view="holdings">Holdings</div>
    <div class="tab" data-view="watchlist">Watchlist</div>
    <div class="tab" data-view="news">News</div>
    <div class="tab" data-view="ledger">Ledger</div>
    <div class="tab" data-view="settings">Settings</div>
  </div>

  <div id="view"></div>
</div>

<!-- Transaction modal -->
<div class="overlay" id="txOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="txTitle">
    <header aria-label="Transaction dialog"><h3 id="txTitle">Add transaction</h3><div class="spacer" style="flex:1"></div>
      <button type="button" class="iconbtn" id="txClose" aria-label="Close">✕</button></header>
    <div class="body">
      <div class="seg" id="txTypeSeg">
        <button type="button" data-type="DEPOSIT" class="active">Deposit</button>
        <button type="button" data-type="WITHDRAW">Withdraw</button>
        <button type="button" data-type="BUY">Buy</button>
        <button type="button" data-type="SELL">Sell</button>
        <button type="button" data-type="ADJUST">Adjust</button>
      </div>

      <!-- available balances for the current context -->
      <div class="balances" id="balanceStrip" style="margin-top:12px"></div>

      <!-- cash fields -->
      <div id="cashFields" style="margin-top:14px">
        <div class="field">
          <label>Amount (USD)</label>
          <input type="text" inputmode="decimal" class="amt" id="cashAmount" placeholder="3,000" autocomplete="off" />
        </div>
        <div id="cashWarn"></div>
      </div>

      <!-- trade fields -->
      <div id="tradeFields" style="display:none;margin-top:14px">
        <div class="field" id="assetPickField" style="display:none">
          <label id="assetPickLabel">Pick a holding</label>
          <select id="assetPick"></select>
        </div>
        <div class="field" id="assetTypeField">
          <label>Asset type</label>
          <div class="seg" id="assetTypeSeg">
            <button type="button" data-atype="crypto" class="active">Crypto</button>
            <button type="button" data-atype="stock">Stock</button>
          </div>
        </div>
        <div class="field">
          <label id="assetLabel">Or search a new asset</label>
          <input type="text" id="assetSearch" placeholder="e.g. bitcoin, INTC, sandisk" autocomplete="off" />
          <div class="search-results" id="searchResults"></div>
          <div class="hint" id="assetPicked"></div>
        </div>
        <div class="row2">
          <div class="field"><label>Quantity</label><input type="text" inputmode="decimal" class="amt" id="qty" placeholder="20" autocomplete="off" /></div>
          <div class="field"><label>Price per unit (USD)</label><input type="text" inputmode="decimal" class="amt" id="price" placeholder="150" autocomplete="off" /></div>
        </div>
        <div class="row2">
          <div class="field"><label>Total (USD)</label><input type="text" inputmode="decimal" class="amt" id="total" placeholder="auto" autocomplete="off" /></div>
          <div class="field"><label>Fee (USD, optional)</label><input type="text" inputmode="decimal" class="amt" id="fee" placeholder="0" autocomplete="off" /></div>
        </div>
        <div class="field" id="sizeField">
          <label id="sizeLabel">Size</label>
          <div class="seg" id="pctSeg">
            <button data-pct="0" type="button">0%</button>
            <button data-pct="25" type="button">25%</button>
            <button data-pct="50" type="button">50%</button>
            <button data-pct="75" type="button">75%</button>
            <button data-pct="100" type="button">Max</button>
          </div>
          <input type="range" id="pctSlider" min="0" max="100" step="1" value="0" style="width:100%;margin-top:9px" />
          <div class="hint" id="sizeHint"></div>
        </div>
        <button class="btn sm" id="useLive" type="button" style="width:100%;margin-bottom:8px">Use live price</button>
        <div class="calc" id="tradeCalc">—</div>
        <div id="tradeWarn"></div>
      </div>

      <!-- adjust fields -->
      <div id="adjustFields" style="display:none;margin-top:14px">
        <div class="field">
          <label>What to adjust</label>
          <div class="seg" id="adjTargetSeg">
            <button type="button" data-adj="cash" class="active">Cash balance</button>
            <button type="button" data-adj="asset">Holding quantity</button>
          </div>
        </div>
        <div class="field" id="adjAssetField" style="display:none">
          <label>Holding</label>
          <select id="adjAsset"></select>
        </div>
        <div class="row2">
          <div class="field">
            <label>Direction</label>
            <div class="seg" id="adjDirSeg">
              <button type="button" data-dir="add" class="active">Add</button>
              <button type="button" data-dir="remove">Remove</button>
            </div>
          </div>
          <div class="field"><label id="adjAmtLabel">Amount (USD)</label><input type="text" inputmode="decimal" class="amt" id="adjAmount" placeholder="0" autocomplete="off" /></div>
        </div>
        <div class="calc" id="adjustCalc">—</div>
        <div id="adjustWarn"></div>
      </div>

      <div class="field" style="margin-top:14px">
        <label>Date</label>
        <input type="datetime-local" id="txDate" />
      </div>
      <div class="field">
        <label>Note (optional)</label>
        <input type="text" id="txNote" placeholder="" />
      </div>
    </div>
    <div class="foot">
      <button type="button" class="btn ghost" id="txCancel">Cancel</button>
      <button type="button" class="btn primary" id="txSave">Save transaction</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/goal-calc.js"></script>
<script src="js/ledger-engine.js"></script>
<script src="js/app.js"></script>
<script type="module" src="js/cloud.js"></script>
</body>
</html>
